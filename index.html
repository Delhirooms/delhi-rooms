<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Rooms</title>
    <style>
        body { font-family: sans-serif; background: #f7f6f2; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn { width: 100%; padding: 15px; background: #01696f; color: white; border: none; border-radius: 10px; margin: 10px 0; font-size: 16px; }
        select { width: 100%; padding: 10px; margin: 10px 0; height: 50px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        .hidden { display: none; }
        label { font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <div class="card" id="home">
        <h1>Delhi Rooms</h1>
        <button class="btn" onclick="show('seeker')">Room Dhoondhein</button>
        <button class="btn" onclick="show('owner')">Owner: List karein</button>
    </div>

    <div class="card hidden" id="seeker">
        <h2>Room Dhoondhein</h2>
        <label>City/Area select karein:</label>
        <select id="city">
            <option value="">-- City/Area Select Karein --</option>
            <option>Delhi - Mukherjee Nagar</option>
            <option>Delhi - Laxmi Nagar</option>
            <option>Noida - Sector 62</option>
            <option>Gurugram - Sector 14</option>
            <option>Greater Noida - Alpha 1</option>
            <option>Ghaziabad - Indirapuram</option>
            <option>Faridabad - Sector 15</option>
        </select>
        <button class="btn" onclick="search()">Search</button>
        <button class="btn" style="background:#666" onclick="show('home')">Back</button>
    </div>

    <div class="card hidden" id="owner">
        <h2>List Room</h2>
        <input style="width:90%; padding:10px; margin:10px 0;" placeholder="Rent Amount (₹)">
        <button class="btn" onclick="alert('Listing Saved!')">Save Listing</button>
        <button class="btn" style="background:#666" onclick="show('home')">Back</button>
    </div>

    <script>
        function show(id) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('seeker').classList.add('hidden');
            document.getElementById('owner').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }
        function search() {
            const city = document.getElementById('city').value;
            if(city) alert('Searching in ' + city);
            else alert('Pehle City/Area select karein!');
        }
    </script>
</body>
</html>
